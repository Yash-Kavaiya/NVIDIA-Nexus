name: Deploy to GCP Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  GCP_REGION: us-central1
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  BACKEND_SERVICE: nvidia-nexus-backend
  FRONTEND_SERVICE: nvidia-nexus-frontend

jobs:
  deploy:
    name: Deploy to GCP
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v1
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}
    
    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v1
    
    - name: Configure Docker for Artifact Registry
      run: |
        gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev
    
    - name: Build and push backend image
      env:
        IMAGE_TAG: ${{ github.sha }}
      run: |
        cd backend
        IMAGE_NAME="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/nvidia-nexus-docker/backend"
        docker build -t $IMAGE_NAME:$IMAGE_TAG .
        docker tag $IMAGE_NAME:$IMAGE_TAG $IMAGE_NAME:latest
        docker push $IMAGE_NAME:$IMAGE_TAG
        docker push $IMAGE_NAME:latest
    
    - name: Build and push frontend image
      env:
        IMAGE_TAG: ${{ github.sha }}
      run: |
        cd frontend
        IMAGE_NAME="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/nvidia-nexus-docker/frontend"
        docker build -t $IMAGE_NAME:$IMAGE_TAG .
        docker tag $IMAGE_NAME:$IMAGE_TAG $IMAGE_NAME:latest
        docker push $IMAGE_NAME:$IMAGE_TAG
        docker push $IMAGE_NAME:latest
    
    - name: Deploy backend to Cloud Run
      run: |
        gcloud run services update ${{ env.BACKEND_SERVICE }} \
          --region ${{ env.GCP_REGION }} \
          --project ${{ env.PROJECT_ID }} \
          --image ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/nvidia-nexus-docker/backend:${{ github.sha }}
    
    - name: Deploy frontend to Cloud Run
      run: |
        gcloud run services update ${{ env.FRONTEND_SERVICE }} \
          --region ${{ env.GCP_REGION }} \
          --project ${{ env.PROJECT_ID }} \
          --image ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/nvidia-nexus-docker/frontend:${{ github.sha }}
    
    - name: Get service URLs
      id: get-urls
      run: |
        BACKEND_URL=$(gcloud run services describe ${{ env.BACKEND_SERVICE }} \
          --region ${{ env.GCP_REGION }} \
          --project ${{ env.PROJECT_ID }} \
          --format 'value(status.url)')
        FRONTEND_URL=$(gcloud run services describe ${{ env.FRONTEND_SERVICE }} \
          --region ${{ env.GCP_REGION }} \
          --project ${{ env.PROJECT_ID }} \
          --format 'value(status.url)')
        echo "backend_url=$BACKEND_URL" >> $GITHUB_OUTPUT
        echo "frontend_url=$FRONTEND_URL" >> $GITHUB_OUTPUT
    
    - name: Deployment summary
      run: |
        echo "✅ Deployment completed successfully!"
        echo "Backend URL: ${{ steps.get-urls.outputs.backend_url }}"
        echo "Frontend URL: ${{ steps.get-urls.outputs.frontend_url }}"
