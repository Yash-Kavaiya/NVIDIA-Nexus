apiVersion: apps/v1
kind: Deployment
metadata:
  name: nvidia-nexus-frontend
  labels:
    app: nvidia-nexus
    component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nvidia-nexus
      component: frontend
  template:
    metadata:
      labels:
        app: nvidia-nexus
        component: frontend
    spec:
      containers:
      - name: frontend
        image: us-central1-docker.pkg.dev/PROJECT_ID/nvidia-nexus-docker/frontend:latest
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: VITE_API_URL
          value: "http://backend-service:8000"
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  labels:
    app: nvidia-nexus
    component: frontend
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 3000
    protocol: TCP
    name: http
  selector:
    app: nvidia-nexus
    component: frontend
